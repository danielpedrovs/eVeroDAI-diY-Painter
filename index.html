<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EVERODAI DIY Painter Assistant</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chat-container">

  <header class="chat-header">
    <h1>EVERO DAI Painter AI</h1>
    <p>Ask about cracks, peeling paint or calculate paint quantity</p>
  </header>

  <div id="chat-box" class="chat-box" role="log" aria-live="polite">
    <div class="message bot">
      <p>Hello 👋 I am your DIY Painter Assistant.</p>
      <p>Describe your wall problem and I will suggest materials, steps and paint estimates.</p>
    </div>
  </div>

  <form id="chat-form" class="input-bar" autocomplete="off">

    <div class="upload-row">
      <input type="file" id="logo-upload" accept="image/png,image/jpeg,image/jpg" style="display:none;">
      <input type="file" id="job-photos-upload" accept="image/*" multiple style="display:none;">
    </div>

    <label for="user-input" class="sr-only">Your question</label>
    <input
      type="text"
      id="user-input"
      name="user-input"
      placeholder="Ask a question…"
      enterkeyhint="send"
    >

    <button type="submit" id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>

  </form>

  <footer>
    DIY Painter AI • Built by @everodecor
  </footer>

</div>

<script type="module" src="/app.js?v=dev"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</body>
</html>
